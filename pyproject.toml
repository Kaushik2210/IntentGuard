[project]
name = "intentguard"
version = "0.1.0"
description = "Intent-aware and behavioural runtime authorization for autonomous AI agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
intentguard = "intentguard.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
langchain = ["langchain>=1.0", "langchain-ollama>=1.0", "langgraph>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intentguard = ["sample_config.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B018", "E501"]
